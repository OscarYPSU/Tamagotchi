; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs ; the nvs system uses littlefs for storage

; debug settings
monitor_filters = direct ; tells the build to not mess w the serial println that goes through
build_flags = -D CORE_DEBUG_LEVEL=3 -D CONFIG_ARDUHAL_LOG_COLORS=1 ; core_debug_level lets you control the verbosity of the debug output
; need config_arduhal_log_colors set to 1 for colro logging because arduino framwork automatically disables color logging