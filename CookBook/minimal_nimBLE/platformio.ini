; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Specific settings for the second MCU
[env:d1]
platform = espressif32
board = esp32s3usbotg
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = knolleary/PubSubClient, h2zero/NimBLE-Arduino @ ^1.4.1
monitor_speed = 115200
upload_port = COM3 ; auto detect the COM port for upload   
monitor_port = COM3 ;auto detect the COM port for upload and monitor
; Tell PlatformIO to ignore all files, then ONLY include mcu_beta.cpp
build_src_filter = -<*> +<Main.cpp>
;build_src_filter = -<*> +<scan.cpp> ;testing scanning

; Specific settings for the second MCU
[env:d2]
platform = espressif32
board = esp32s3usbotg
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = knolleary/PubSubClient, h2zero/NimBLE-Arduino @ ^1.4.1
monitor_speed = 115200
upload_port = COM4 ; auto detect the COM port for upload   
monitor_port = COM4 ;auto detect the COM port for upload and monitor
; Tell PlatformIO to ignore all files, then ONLY include mcu_beta.cpp
build_src_filter = -<*> +<Main.cpp>
;build_src_filter = -<*> +<scan.cpp> ;testing scanning