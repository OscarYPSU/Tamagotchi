; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; Specific settings for the second MCU
[env:d1]
platform = espressif32
board = esp32s3usbotg
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = knolleary/PubSubClient, h2zero/NimBLE-Arduino @ ^1.4.1, bblanchon/ArduinoJson @ ^7.0.0
monitor_speed = 115200
upload_port = COM3 ; auto detect the COM port for upload   
monitor_port = COM3 ;auto detect the COM port for upload and monitor
; Tell PlatformIO to ignore all files, then ONLY include mcu_beta.cpp
build_src_filter = -<*> +<BLE.cpp> +<AWS_CONFIGS.cpp> +<Main.cpp> +<device_state.cpp> +<NVS.cpp> +<AP.cpp>
;build_src_filter = -<*> +<scan.cpp> ;testing scanning
board_build.filesystem = littlefs ; the nvs system uses littlefs for storage
; debug settings
monitor_filters = direct ; tells the build to not mess w the serial println that goes through
build_flags = -D CORE_DEBUG_LEVEL=3 -D CONFIG_ARDUHAL_LOG_COLORS=1 ; core_debug_level lets you control the verbosity of the debug output
; need config_arduhal_log_colors set to 1 for colro logging because arduino framwork automatically disables color logging

